<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-t>Page not found — Hood Ride</title>
  <!-- the answer to an address that doesn't exist, with a real 404
       (PageController.not_found, owner 2026-11-02): it says so, and the
       way home — never the app silently showing the map. Plain HTML, no
       app code; its look is privacy.css (no inline styles: HoodrideWeb.CSP) -->
  <!-- its files from the site's root ("/…"), whatever the address: at
       /no/such/page, "privacy.css" was looked for in /no/such/ — the page
       showed unstyled, its car and words missing (found 2026-11-04; a
       <base> is refused by the CSP, base-uri 'none') -->
  <link rel="stylesheet" href="/privacy.css" />
</head>
<body>
<main class="notfound">
  <img src="/car.png" alt="" width="120" />
  <h1 data-t>Page not found</h1>
  <p class="muted" data-t>This page doesn't exist.</p>
  <a class="home" href="/" data-t>Go to Hood Ride</a>
</main>
<!-- its words in the reader's language (HoodI18n; the server adds that
     language's catalog right after i18n.js — PageController.in_language) -->
<script src="/i18n.js"></script>
</body>
</html>
