# /etc/systemd/journald.conf.d/hoodride.conf (setup.sh installs it).
# The privacy policy's promise: technical logs are kept 14 days. journald
# deletes by age only when MaxRetentionSec is set (off by default), and only
# WHOLE files — its default file spans a month, so files rotate daily here
# to keep nothing much past 14 days. Applies to every log on this server
# (a server dedicated to Hood Ride).
[Journal]
MaxRetentionSec=14day
MaxFileSec=1day
