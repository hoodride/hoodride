// Hood Ride: when an installed security fix needs a restart (mostly a new
// kernel: /var/run/reboot-required), restart at 10:00 UTC (overnight in the US) — never
// otherwise (owner, 2026-10-29). ~70 s offline; the app and tunnel come
// back by themselves. The fixes install at ~09:00 (apt-timers.conf).
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
Unattended-Upgrade::Automatic-Reboot-Time "10:00";
